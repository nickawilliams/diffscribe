# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: diffscribe

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

dist: ./.out/dist

before:
  hooks:
    - make prep
    - make changelog
    - make man

builds:
  - env:
      - CGO_ENABLED=0
      - VERSION={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm
      - arm64
      - "386"
    ignore:
      - goos: windows
        goarch: arm
    ldflags:
      - "-s -w -X github.com/rogwilco/diffscribe/internal/version.version={{ .Env.VERSION }}"
    flags:
      - "-trimpath"

archives:
  - files:
      - README.md
      - LICENSE.md
      - CHANGELOG.md
      - contrib/man/diffscribe.1
      - src: contrib/completions/bash/diffscribe.bash
        dst: completions/bash/diffscribe.bash
      - src: contrib/completions/zsh/diffscribe.zsh
        dst: completions/zsh/diffscribe.zsh
      - src: contrib/completions/fish/diffscribe.fish
        dst: completions/fish/diffscribe.fish
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}x86
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    wrap_in_directory: true

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{- .Version }}_source"

changelog:
  disable: true # release notes handled via git-cliff (see release.header)

release:
  draft: false
  prerelease: auto
  make_latest: true
  mode: replace
  header: |
    {{- if .Env.GIT_CLIFF_RELEASE_NOTES }}
    {{ .Env.GIT_CLIFF_RELEASE_NOTES }}
    {{- else -}}
    WARNING: git-cliff release notes missing -- rerun via `make release`.
    {{- end }}
